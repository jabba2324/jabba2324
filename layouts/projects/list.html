{{ define "main" }}

<div class="hex-wrap">
  <div class="hex-container" id="hex-container">
    {{ range hugo.Data.projects }}
    {{ range .items }}
    <a class="hex" href="{{ .url }}" target="_blank" rel="noopener" title="{{ .description }}">
      <div class="hex-fill">
        <div class="hex-inner">
          {{ with .icon }}<span class="hex-icon">{{ . }}</span>{{ end }}
          <span class="hex-name">{{ .name }}</span>
          {{ if .live }}<span class="hex-live">↗</span>{{ end }}
        </div>
      </div>
    </a>
    {{ end }}
    {{ end }}
  </div>
</div>

<script>
(function () {
  const container = document.getElementById('hex-container');
  const hexEls = Array.from(container.querySelectorAll('.hex'));

  const S   = 85;
  const W   = S * 2;
  const H   = S * Math.sqrt(3);
  const GAP = 6;
  const spc = S + GAP / 2;

  const greys = ['#e8e8e8','#e2e2e2','#ececec','#d8d8d8','#f0f0f0','#e6e6e6','#dadada'];

  function hexRange(radius) {
    const pos = [];
    for (let q = -radius; q <= radius; q++) {
      for (let r = Math.max(-radius, -q - radius); r <= Math.min(radius, -q + radius); r++) {
        pos.push([q, r]);
      }
    }
    pos.sort(function (a, b) {
      const da = Math.max(Math.abs(a[0]), Math.abs(a[1]), Math.abs(-a[0] - a[1]));
      const db = Math.max(Math.abs(b[0]), Math.abs(b[1]), Math.abs(-b[0] - b[1]));
      return da !== db ? da - db : Math.atan2(a[1], a[0]) - Math.atan2(b[1], b[0]);
    });
    return pos;
  }

  function toPixel(q, r) {
    return {
      x: spc * 1.5 * q,
      y: spc * Math.sqrt(3) * (r + q / 2)
    };
  }

  const positions = hexRange(3).slice(0, hexEls.length);
  const coords    = positions.map(function ([q, r]) { return toPixel(q, r); });

  const minX = Math.min.apply(null, coords.map(function (c) { return c.x; }));
  const minY = Math.min.apply(null, coords.map(function (c) { return c.y; }));
  const maxX = Math.max.apply(null, coords.map(function (c) { return c.x; }));
  const maxY = Math.max.apply(null, coords.map(function (c) { return c.y; }));

  container.style.width  = (maxX - minX + W) + 'px';
  container.style.height = (maxY - minY + H) + 'px';

  hexEls.forEach(function (el, i) {
    el.style.left = (coords[i].x - minX) + 'px';
    el.style.top  = (coords[i].y - minY) + 'px';
    el.querySelector('.hex-fill').style.background = greys[i % greys.length];
  });
})();
</script>
{{ end }}
