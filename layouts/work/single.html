{{ define "main" }}
<article class="cv">
  <header class="cv-header">
    <div class="cv-header-top">
      <img class="cv-profile-pic" src="/assets/profile.jpg" alt="Chris Sewell">
      <div class="cv-header-info">
        <h1>{{ .Title }}</h1>
        {{ with .Params.tagline }}<p class="cv-tagline">{{ . }}</p>{{ end }}
        <p class="profile-bio">{{ .Site.Params.bio }}</p>
        <a class="profile-cv-btn" href="/assets/profile.pdf" download>↓ Download CV</a>
      </div>
    </div>
  </header>

  <div class="cv-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
