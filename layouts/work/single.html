{{ define "main" }}
<article class="cv">
  <header class="cv-header">
    <h1>{{ .Title }}</h1>
    {{ with .Params.tagline }}<p class="cv-tagline">{{ . }}</p>{{ end }}
    <a class="profile-cv-btn" href="/assets/profile.pdf" download>↓ Download CV</a>
  </header>

  <div class="cv-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
