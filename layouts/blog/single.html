{{ define "main" }}
<article class="prose">
  
  <time class="post-date">{{ .Date.Format "2 January 2006" }}</time>
  {{ with .Params.github_project }}
  <p class="project-link">
    <a href="https://github.com/{{ $.Site.Params.github }}/{{ . }}" target="_blank" rel="noopener">
      → GitHub: {{ . }}
    </a>
  </p>
  {{ end }}
  {{ .Content }}
</article>
<p><a href="/">← Back</a></p>
{{ end }}
